    const CAT_META = [
      ["all", "All"],
      ["ai", "AI"],
      ["github", "GitHub"],
      ["free_deals", "Free API & VPS"],
      ["war", "War & World"],
      ["stocks_gold", "Stocks & Gold"],
      ["ram_hardware", "RAM & Hardware"],
    ];

    let activeCat = "all";
    let searchTerm = "";

    function esc(s) {
      return String(s || "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[m]);
    }

    function renderHeader() {
      document.getElementById("edition").textContent = "#" + (DATA.edition || 1);
      document.getElementById("updated").textContent = DATA.updated_dhaka || "";
      document.getElementById("advice-tag").textContent = (DATA.advice && DATA.advice.tag) || "Briefing";
      document.getElementById("advice-title").textContent = (DATA.advice && DATA.advice.title) || "";
      document.getElementById("advice-body").textContent = (DATA.advice && DATA.advice.body) || "";

      const ticker = document.getElementById("ticker");
      if (DATA.markets && DATA.markets.length) {
        ticker.innerHTML = DATA.markets.map(m => {
          const sign = m.change_pct >= 0 ? "+" : "";
          const cls = m.change_pct >= 0 ? "up" : "down";
          return `<div class="m-pill mono"><span class="m-label">${esc(m.label)}</span><span class="m-price">${esc(m.price)}</span><span class="m-chg ${cls}">${sign}${m.change_pct}%</span></div>`;
        }).join("");
      } else {
        ticker.innerHTML = `<div class="m-pill mono"><span class="m-label">Markets syncing...</span></div>`;
      }
    }

    function allItems() {
      const list = [];
      for (const [key, label] of CAT_META) {
        if (key === "all") continue;
        for (const it of (DATA.categories[key] || [])) {
          list.push({ ...it, _cat: key, _catLabel: label });
        }
      }
      return list;
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      const total = allItems().length;
      tabs.innerHTML = CAT_META.map(([key, label]) => {
        const cnt = key === "all" ? total : (DATA.categories[key] || []).length;
        const cls = key === activeCat ? "tab active" : "tab";
        return `<button class="${cls}" data-cat="${key}">${esc(label)}<span class="cnt">${cnt}</span></button>`;
      }).join("");
      tabs.querySelectorAll(".tab").forEach(btn => {
        btn.onclick = () => { activeCat = btn.dataset.cat; renderTabs(); renderGrid(); };
      });
    }

    function renderGrid() {
      const grid = document.getElementById("grid");
      const q = searchTerm.trim().toLowerCase();
      let items = activeCat === "all"
        ? allItems()
        : (DATA.categories[activeCat] || []).map(it => ({ ...it, _cat: activeCat, _catLabel: CAT_META.find(c => c[0] === activeCat)[1] }));

      if (q) {
        items = items.filter(it =>
          (it.title + " " + (it.bn_summary || "") + " " + (it.summary || "") + " " + (it.source || "") + " " + it._catLabel)
            .toLowerCase().includes(q)
        );
      }

      if (!items.length) {
        grid.innerHTML = `<div class="empty">No matching items right now. Try another category or keyword.</div>`;
        return;
      }

      grid.innerHTML = items.map(it => {
        const src = (it.source || "Web").toLowerCase();
        const srcCls = src.includes("github") ? "src-gh" : src.includes("twitter") || src === "x" ? "src-x" : src.includes("reddit") ? "src-rd" : "";
        const starsHtml = it.stars ? `<span class="stars mono">★ ${Number(it.stars).toLocaleString()}</span>` : "";
        const langHtml = it.language ? `<span class="badge mono">${esc(it.language)}</span>` : "";
        const bnHtml = it.bn_summary ? `<div class="bn-note">${esc(it.bn_summary)}</div>` : "";
        const enHtml = it.summary && it.summary !== it.title ? `<div class="en-sub">${esc(it.summary)}</div>` : "";
        return `
          <a class="card" href="${esc(it.url)}" target="_blank" rel="noopener noreferrer">
            <div>
              <div class="card-top">
                <div class="badges">
                  <span class="badge cat">${esc(it._catLabel)}</span>
                  <span class="badge ${srcCls}">${esc(it.source || "Web")}</span>
                  ${langHtml}
                </div>
                ${starsHtml}
              </div>
              <h3>${esc(it.title)}</h3>
              ${bnHtml}
              ${enHtml}
            </div>
            <div class="card-foot mono">
              <span>${esc(it.published || "Recent")}</span>
              <span class="open-link">Open &rarr;</span>
            </div>
          </a>`;
      }).join("");
    }

    document.getElementById("search").addEventListener("input", e => {
      searchTerm = e.target.value;
      renderGrid();
    });

    renderHeader();
    renderTabs();
    renderGrid();
  </script>
